<meta charset="UTF-8">

<meta

<title>Contagem de Dinheiro</title>

<!-- Bootstrap -->
<link href="css/bootstrap.min.css" rel="stylesheet">
<link href="css/themes.css" rel="stylesheet">

<style>

    /* body {
        background: #f5f5f5;
    } */

    .contagem-card {
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
    }

    .valor-total {
        font-size: 32px;
        font-weight: 700;
    }

    .resultado {
        background: var(--bg-body);
        border-radius: 10px;
        padding: 20px;
    }

    .denominacao {
        font-weight: 600;

                        data-valor="10000"
