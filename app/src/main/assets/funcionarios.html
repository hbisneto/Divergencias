<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionários - Divergências</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/themes.css" rel="stylesheet">
    <link href="css/funcionario.css" rel="stylesheet">
    <!-- <link href="css/escala.css" rel="stylesheet"> -->
    <style>
        .funcionario-item {
            border: 1px solid var(--bg-body);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            background: var(--bg-body);
        }
        .funcionario-item .nome {
            font-weight: 700;
            font-size: 1rem;
        }
        .funcionario-item .meta {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .badge-cargo {
            font-size: 0.75rem;
            background: #263746;
        }
    </style>
</head>

<body>
    <!-- =========================================================
     NAVBAR + MENU LATERAL (estilo app nativo)
     ========================================================= -->
    <!-- Navbar centralizado (carregado por js/navbar.js) -->
    <div id="app-navbar"></div>

    <main class="container escala-container">
        <div class="card shadow-sm">
            <div class="card-body p-3 p-md-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>

                        <h2 class="mb-4"><strong>Funcionários</strong></h2>
                        <p class="text-muted mb-3">
                            Cadastre colaboradores para usar nas escalas.
                        </p>
                    </div>
                    <button type="button" class="btn btn-danger btn-sm" id="btnNovo">
                        + Novo
                    </button>
                </div>
                <hr class="my-4">

                <!-- Formulário -->
                <div id="formularioFuncionario" class="border rounded p-3 mb-4 d-none">
                    <h6 class="mb-3" id="tituloFormulario">Novo funcionário</h6>

                    <div class="row g-3">
                        <div class="col-12 col-md-4">
                            <label for="inputCracha" class="form-label">Crachá</label>
                            <input type="text" class="form-control" id="inputCracha"
                                   placeholder="Ex.: 9059761" maxlength="20" inputmode="numeric">
                        </div>
                        <div class="col-12 col-md-5">
                            <label for="inputNome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="inputNome"
                                   placeholder="Nome completo" maxlength="80">
                        </div>
                        <div class="col-12 col-md-3">
                            <label for="selectCargo" class="form-label">Cargo</label>
                            <select class="form-select" id="selectCargo">
                                <option value="">Selecione...</option>
                                <option value="Atendente 1">Atendente 1</option>
                                <option value="Atendente 2">Atendente 2</option>
                                <option value="Supervisor">Supervisor</option>
                                <option value="Farmaceutico">Farmacêutico</option>
                                <option value="Gerente">Gerente</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-3">
                        <button type="button" class="btn btn-danger" id="btnSalvarFunc">
                            Salvar
                        </button>
                        <button type="button" class="btn btn-outline-secondary" id="btnCancelarForm">
                            Cancelar
                        </button>
                    </div>
                </div>

                <div id="listaFuncionariosCadastrados">
                    <div class="text-muted text-center py-4">Carregando...</div>
                </div>

                <div id="mensagemFuncionarios" class="alert d-none mt-3" role="status"></div>
            </div>
        </div>
    </main>

    <!-- Modal confirmação exclusão -->
    <div class="modal fade" id="modalExcluirFunc" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Excluir funcionário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="textoExcluirFunc">
                    Deseja realmente excluir este funcionário?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarExcluir">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/navbar.js"></script>   <!-- ← novo -->
    <script src="js/funcionarios.js"></script>   <!-- script específico da página -->
</body>
</html>
