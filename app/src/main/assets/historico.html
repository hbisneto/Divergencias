<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Histórico - Divergências</title>

    <link
        href="css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

    <!-- Navbar -->

    <!-- =========================================================
     NAVBAR + MENU LATERAL (estilo app nativo)
     ========================================================= -->

<nav
    class="navbar"
    style="background-color: #b6202f;"
    data-bs-theme="dark"
>
    <div class="container-fluid">

        <!-- Botão hamburger -->
        <button
            class="navbar-toggler border-0"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#menuLateral"
            aria-controls="menuLateral"
            aria-label="Abrir menu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Nome do app (centro) -->
        <a
            class="navbar-brand fw-bold mx-auto"
            href="index.html"
        >
            Divergências
        </a>

        <!-- Espaço vazio para equilibrar o layout -->
        <div style="width: 40px;"></div>

    </div>
</nav>


<!-- =========================================================
     MENU LATERAL (Offcanvas)
     ========================================================= -->

<div
    class="offcanvas offcanvas-start"
    tabindex="-1"
    id="menuLateral"
    aria-labelledby="menuLateralLabel"
>
    <div class="offcanvas-header" style="background-color: #b6202f;">
        <h5
            class="offcanvas-title text-white fw-bold"
            id="menuLateralLabel"
        >
            Divergências
        </h5>

        <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="offcanvas"
            aria-label="Fechar"
        ></button>
    </div>

    <div class="offcanvas-body p-0">

        <div class="list-group list-group-flush">

            <a
                href="sobre.html"
                class="list-group-item list-group-item-action py-3"
            >
                <strong>Sobre o app</strong>
                <div class="small text-muted">
                    Versão e informações
                </div>
            </a>

            <a
                href="index.html"
                class="list-group-item list-group-item-action py-3"
            >
                <strong>Calcular divergência</strong>
                <div class="small text-muted">
                    Registrar nova divergência
                </div>
            </a>

            <a
                href="historico.html"
                class="list-group-item list-group-item-action py-3"
            >
                <strong>Histórico</strong>
                <div class="small text-muted">
                    Ver divergências registradas
                </div>
            </a>

            <a
                href="notas.html"
                class="list-group-item list-group-item-action py-3"
            >
                <strong>Contagem de notas</strong>
                <div class="small text-muted">
                    Contar cédulas e moedas
                </div>
            </a>

            <!-- <a
                href="sobre.html"
                class="list-group-item list-group-item-action py-3"
            >
                <strong>Sobre o app</strong>
                <div class="small text-muted">
                    Versão e informações
                </div>
            </a> -->

        </div>

    </div>
</div>


    <!-- Conteúdo -->

    <main class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h1 class="h3 mb-1">
                    Histórico
                </h1>

                <p class="text-muted mb-0">
                    Divergências registradas
                </p>

            </div>

            <a
                href="index.html"
                class="btn btn-outline-secondary"
            >
                Nova divergência
            </a>

        </div>


        <!-- Histórico -->

        <div id="historico">

            <div class="text-muted text-center py-4">
                Carregando histórico...
            </div>

        </div>

    </main>


    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/historico.js"></script>

</body>

</html>
