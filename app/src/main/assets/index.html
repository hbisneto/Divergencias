<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Divergências</title>

    <!-- Bootstrap -->
    <link
            href="css/bootstrap.min.css"
            rel="stylesheet"
    >

    <style>
        body {
            background: #f5f5f5;
        }

        .divergencia-card {
            max-width: 600px;
            margin: 60px auto;
        }

        .resultado {
            background: #f8f8f8;
            border-radius: 10px;
            padding: 20px;
        }

        .valor-divergencia {
            font-size: 32px;
            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card shadow-sm divergencia-card">
        <div class="card-body p-4">

            <h3 class="mb-4">Sistema de Divergências</h3>

            <form id="formDivergencia">

                <!-- Valor original -->
                <div class="mb-3">
                    <label for="valorOriginal" class="form-label">
                        Valor unitário original
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">R$</span>

                        <input
                                type="text"
                                class="form-control"
                                id="valorOriginal"
                                placeholder="24,97"
                                inputmode="decimal"
                                required
                        >
                    </div>
                </div>

                <!-- Quantidade -->
                <div class="mb-3">
                    <label for="quantidade" class="form-label">
                        Quantidade
                    </label>

                    <input
                            type="number"
                            class="form-control"
                            id="quantidade"
                            min="1"
                            placeholder="3"
                            required
                    >
                </div>

                <!-- Valor promocional -->
                <div class="mb-4">
                    <label for="valorPromocional" class="form-label">
                        Valor promocional unitário
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">R$</span>

                        <input
                                type="text"
                                class="form-control"
                                id="valorPromocional"
                                placeholder="15,00"
                                inputmode="decimal"
                                required
                        >
                    </div>
                </div>

                <button
                        type="submit"
                        class="btn btn-danger w-100"
                >
                    Calcular divergência
                </button>

            </form>

            <hr class="my-4">

            <div class="resultado">
                <div class="text-muted mb-2">
                    Divergência encontrada
                </div>

                <div
                        id="resultado"
                        class="valor-divergencia"
                >
                    R$ 0,00
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const form = document.getElementById("formDivergencia");
    const resultado = document.getElementById("resultado");

    function moedaParaNumero(valor) {
        return parseFloat(
            valor
                .replace(/\./g, "")
                .replace(",", ".")
        );
    }

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const valorOriginal = moedaParaNumero(
            document.getElementById("valorOriginal").value
        );

        const quantidade = parseInt(
            document.getElementById("quantidade").value
        );

        const valorPromocional = moedaParaNumero(
            document.getElementById("valorPromocional").value
        );

        const valorSemPromocao =
            valorOriginal * quantidade;

        const valorComPromocao =
            valorPromocional * quantidade;

        const divergencia =
            valorSemPromocao - valorComPromocao;

        resultado.textContent =
            divergencia.toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL"
            });
    });
</script>

</body>
</html>
