<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Divergências</title>

    <!-- Bootstrap -->
    <link
            href="css/bootstrap.min.css"
            rel="stylesheet"
    >

    <style>
        body {
            background: #f5f5f5;
        }

        .divergencia-card {
            max-width: 800px;
            margin: 40px auto;
        }

        /* .divergencia-card {
            max-width: 600px;
            margin: 60px auto;
        } */

        .resultado {
            background: #f8f8f8;
            border-radius: 10px;
            padding: 20px;
        }

        .valor-divergencia {
            font-size: 32px;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <nav
    class="navbar navbar-expand-lg"
    style="background-color: #b6202f;"
    data-bs-theme="dark"
>

    <div class="container-fluid">

        <a
            class="navbar-brand fw-bold"
            href="index.html"
        >
            Divergências
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu"
            aria-controls="navbarMenu"
            aria-expanded="false"
            aria-label="Abrir menu"
        >

            <span class="navbar-toggler-icon"></span>

        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarMenu"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="historico.html"
                    >
                        Histórico
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link disabled"
                        aria-disabled="true"
                        href="#"
                    >
                        Exportar Divergências...
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>



<div class="container">
    <div class="card shadow-sm divergencia-card">
        <div class="card-body p-4">

            <h3 class="mb-4">Sistema de Divergências</h3>

            <form id="formDivergencia">

                <!-- Valor original -->
                <div class="mb-3">
                    <label for="valorOriginal" class="form-label">
                        Valor unitário original
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">R$</span>

                        <input
                                type="text"
                                class="form-control"
                                id="valorOriginal"
                                placeholder="0,00"
                                inputmode="decimal"
                                required
                        >
                    </div>
                </div>

                <!-- Quantidade -->
                <div class="mb-3">
                    <label for="quantidade" class="form-label">
                        Quantidade
                    </label>

                    <input
                            type="number"
                            class="form-control"
                            id="quantidade"
                            min="1"
                            placeholder="0"
                            required
                    >
                </div>

                <!-- Valor promocional -->
                <div class="mb-4">
                    <label for="valorPromocional" class="form-label">
                        Valor promocional unitário
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">R$</span>

                        <input
                                type="text"
                                class="form-control"
                                id="valorPromocional"
                                placeholder="0,00"
                                inputmode="decimal"
                                required
                        >
                    </div>
                </div>

                <button
                        type="submit"
                        class="btn btn-danger w-100"
                >
                    Calcular divergência
                </button>

            </form>

            <hr class="my-4">

            <div class="resultado">
                <div class="text-muted mb-2">
                    Divergência encontrada
                </div>

                <div
                        id="resultado"
                        class="valor-divergencia"
                >
                    R$ 0,00
                </div>
            </div>

            <hr class="my-4">

<div>
    <h4 class="mb-3">
        Histórico de Divergências
    </h4>

    <div id="historico">
        <div class="text-muted text-center py-3">
            Carregando histórico...
        </div>
    </div>
</div>

        </div>
    </div>
</div>

<!-- =========================================================
     MODAL DE CONFIRMAÇÃO DE EXCLUSÃO
     ========================================================= -->

<div
    class="modal fade"
    id="modalConfirmarExclusao"
    tabindex="-1"
    aria-labelledby="modalConfirmarExclusaoLabel"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5
                    class="modal-title"
                    id="modalConfirmarExclusaoLabel"
                >
                    Tem certeza?
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Fechar"
                ></button>
            </div>

            <div class="modal-body">
                Deseja realmente excluir esta divergência?
            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancelar
                </button>

                <button
                    type="button"
                    class="btn btn-danger"
                    id="confirmarExclusao"
                >
                    Excluir
                </button>

            </div>

        </div>
    </div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
